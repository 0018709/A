name: Update NBIS options heatmap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Что обновить"
        required: true
        default: "current"
        type: choice
        options:
          - current
          - previous_close
          - market_only

  schedule:
    # Price tape: hourly, broad UTC window covers Europe and US extended hours.
    - cron: "7 0-2,6-23 * * *"

    # Options current snapshot: hourly candidate across EDT/EST cash-session windows.
    - cron: "37 13-21 * * 1-5"

    # Previous-close model around 08:45 New York in both DST/EST possibilities.
    - cron: "45 12,13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nbis-options-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide mode
        id: decide
        shell: bash
        env:
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          now = datetime.now(ZoneInfo("America/New_York"))

          if event == "workflow_dispatch":
              mode = os.environ.get("MANUAL_MODE") or "current"
          elif now.weekday() >= 5:
              mode = "market_only"
          elif now.hour == 8 and 40 <= now.minute <= 50:
              mode = "previous_close"
          elif 9 <= now.hour < 16 and 30 <= now.minute <= 44:
              # :37 candidate during the US cash session.
              mode = "current"
          else:
              mode = "market_only"

          print("New York time:", now.isoformat())
          print("Mode:", mode)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"mode={mode}\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data
        run: python fetch_nbis.py --mode "${{ steps.decide.outputs.mode }}"

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "nbis-vex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update NBIS ${{ steps.decide.outputs.mode }}"
            git push origin HEAD:main
          fi
