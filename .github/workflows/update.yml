name: Update NBIS options heatmap

on:
  workflow_dispatch:
  schedule:
    - cron: "37 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nbis-hourly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check New York market hour
        id: market
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          now = datetime.now(ZoneInfo("America/New_York"))

          ok = (
              now.weekday() < 5
              and (now.hour > 9 or (now.hour == 9 and now.minute >= 30))
              and now.hour < 16
          )

          print("New York time:", now.isoformat())

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if ok else 'false'}\n")
          PY

      - name: Set up Python
        if: steps.market.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.market.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Fetch NBIS data and calculate VEX/GEX
        if: steps.market.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python fetch_nbis.py

      - name: Commit updated snapshot
        if: steps.market.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "nbis-vex-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update NBIS options snapshot"
            git push origin HEAD:main
          fi
